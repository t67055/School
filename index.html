<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Projects</title>
<style>
:root { color-scheme: light; --bg: #f6f6f3; --fg: #0b0b0b; --muted: #5f5e5a; --line: #e2e1dc; --accent: #2a78d6; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #121211; --fg: #f0efec; --muted: #a9a89f; --line: #2e2e2c; --accent: #6aa7f0; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 42rem; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-left, 0px)) 64px; }
h1 { font: 400 2rem/1.2 Georgia, "Times New Roman", serif; margin: 0 0 24px; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li { padding: 16px 0; border-bottom: 1px solid var(--line); }
a { color: var(--accent); font-weight: 600; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
p { margin: 4px 0 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>School projects</h1>
  <ul>
    <li>
      <a href="aging-survey-explorer/">Aging Survey Explorer</a>
      <p>Project 1 aging survey: 732 respondents across 8 groups, compared by age, gender, location and survey group, with themes from the open-ended answers.</p>
    </li>
  </ul>
</main>
</body>
</html>
